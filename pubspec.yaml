name: yolo_app
description: YOLO! Stop Thinking. Start Living.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.5.2
  geolocator: ^14.1.2
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  screenshot: ^3.0.0
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  camera: ^0.12.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # Keep the iOS/macOS-only implementation compatible with Windows web builds.
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/shinchan.png
